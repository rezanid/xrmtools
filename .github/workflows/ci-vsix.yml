name: CI - VSIX

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/XrmTools.Meta.Attributes/**" 
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/XrmTools.Meta.Attributes/**" 
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: "Release"

  SOLUTION_PATH: "src/XrmTools.slnx"
  VSIX_PROJECT_DIR: "src/XrmTools/"
  VSIX_MANIFEST_PATH: "src/XrmTools/source.extension.vsixmanifest"
  VSIX_MANIFEST_SOURCE_PATH: "src/XrmTools/source.extension.cs"

  TEST_RESULTS_DIR: "artifacts/test-results"
  VSIX_STAGING_DIR: "artifacts/vsix"

jobs:
  validate:
    name: Build & Test (no private key)
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write

    outputs:
      version: ${{ steps.vsix_version.outputs['version-number'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Build Tooling
        uses: timheuer/bootstrap-dotnet@297919189407e7c88a8659dc534aa9daafe64908 # v2
        with:
          msbuild: 'true'
          sdk: 'true'
          nuget: 'false'

      - name: Stamp VSIX revision from run number
        id: vsix_version
        uses: timheuer/vsix-version-stamp@9d38292e99e54046455bb68c6a2b5113d269a7d0 # v2
        with:
          manifest-file: ${{ env.VSIX_MANIFEST_PATH }}
          vsix-token-source-file: ${{ env.VSIX_MANIFEST_SOURCE_PATH }}
          version-type: revision
          build-number: ${{ github.run_number }}

      - name: Build with public key (delay-signed wizard, no VSIX packaging)
        shell: pwsh
        run: |
          $privateKey = Join-Path $env:GITHUB_WORKSPACE "src\key.snk"
          if (Test-Path -LiteralPath $privateKey) {
            throw "Private strong-name key must not be present in the validation job."
          }

          # CreatePkgDef loads registered assemblies. A delay-signed assembly cannot be
          # loaded because its final strong-name signature is intentionally absent.
          # The trusted package_signed job performs the complete VSIX packaging build.
          msbuild "${{ env.SOLUTION_PATH }}" /v:m -restore `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:GeneratePkgDefFile=false `
            /p:CreateVsixContainer=false
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed." }

          $wizardAssembly = Join-Path $env:GITHUB_WORKSPACE "src\Templates\XrmTools.WebResourceProjectTemplate\bin\${{ env.CONFIGURATION }}\XrmTools.WebResourceProjectTemplate.dll"
          $token = ([Reflection.AssemblyName]::GetAssemblyName($wizardAssembly).GetPublicKeyToken() |
            ForEach-Object { $_.ToString("x2") }) -join ""
          if ($token -ne "26be58bdab7122ab") {
            throw "Unexpected wizard public-key token '$token'."
          }

      - name: Create test results folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.TEST_RESULTS_DIR }}" | Out-Null

      - name: Run unit tests (SDK-style) + TRX
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path "src/Tests" -Recurse -Filter *.csproj |
            Sort-Object FullName |
            Select-Object -ExpandProperty FullName

          if ($testProjects.Count -eq 0) {
            throw "No test projects found under src/Tests."
          }

          foreach ($testProject in $testProjects) {
            dotnet test $testProject `
              -c "${{ env.CONFIGURATION }}" `
              --no-build `
              --logger "trx;LogFileName=$([System.IO.Path]::GetFileNameWithoutExtension($testProject))-test-results-${{ github.run_id }}.trx" `
              --results-directory "${{ env.TEST_RESULTS_DIR }}"

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed for $testProject"
            }
          }

      - name: Publish test report (PR Checks)
        if: ${{ always() && hashFiles('artifacts/test-results/*.trx') != '' }}
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Unit Tests
          path: ${{ env.TEST_RESULTS_DIR }}/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload test results artifact
        if: ${{ always() && hashFiles('artifacts/test-results/*.trx') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}

      - name: Build summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $v = "${{ steps.vsix_version.outputs['version-number'] }}"
          "### Validation summary" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Version stamped: **$v**" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Wizard signing: **public-key delay signing**" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Configuration: **${{ env.CONFIGURATION }}**" | Out-File -Append $env:GITHUB_STEP_SUMMARY

  package_signed:
    name: Build signed VSIX
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: windows-latest
    environment: nightly-signing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Build Tooling
        uses: timheuer/bootstrap-dotnet@297919189407e7c88a8659dc534aa9daafe64908 # v2
        with:
          msbuild: "true"
          sdk: "true"
          nuget: "false"

      - name: Stamp VSIX version (exact)
        uses: timheuer/vsix-version-stamp@9d38292e99e54046455bb68c6a2b5113d269a7d0 # v2
        with:
          manifest-file: ${{ env.VSIX_MANIFEST_PATH }}
          vsix-token-source-file: ${{ env.VSIX_MANIFEST_SOURCE_PATH }}
          version-number: ${{ needs.validate.outputs.version }}

      - name: Materialize key, build, verify, and remove key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "STRONG_NAME_KEY_BASE64 is unavailable. Configure it on the nightly-signing environment."
          }

          $keyPath = Join-Path $env:GITHUB_WORKSPACE "src\key.snk"
          $wizardAssembly = Join-Path $env:GITHUB_WORKSPACE "src\Templates\XrmTools.WebResourceProjectTemplate\bin\${{ env.CONFIGURATION }}\XrmTools.WebResourceProjectTemplate.dll"
          $sn = "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools\sn.exe"

          try {
            $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
            [IO.File]::WriteAllBytes($keyPath, $keyBytes)

            msbuild "${{ env.SOLUTION_PATH }}" /v:m -restore /p:Configuration=${{ env.CONFIGURATION }}
            if ($LASTEXITCODE -ne 0) { throw "Signed MSBuild failed." }

            & $sn -vf $wizardAssembly
            if ($LASTEXITCODE -ne 0) { throw "Strong-name verification failed." }

            $token = ([Reflection.AssemblyName]::GetAssemblyName($wizardAssembly).GetPublicKeyToken() |
              ForEach-Object { $_.ToString("x2") }) -join ""
            if ($token -ne "26be58bdab7122ab") {
              throw "Unexpected wizard public-key token '$token'."
            }
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\STRONG_NAME_KEY_BASE64 -ErrorAction SilentlyContinue
          }

      - name: Guard - private key was removed
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:GITHUB_WORKSPACE "src\key.snk"
          if (Test-Path -LiteralPath $keyPath) {
            throw "Private strong-name key remains on disk."
          }

      - name: Stage VSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VSIX_STAGING_DIR }}" | Out-Null

          $searchRoot = Join-Path $env:GITHUB_WORKSPACE "${{ env.VSIX_PROJECT_DIR }}"
          $files = Get-ChildItem -Path $searchRoot -Recurse -Filter *.vsix |
            Where-Object { $_.FullName -notmatch '\\obj\\' }

          if ($files.Count -eq 0) { throw "No .vsix produced under: $searchRoot" }
          if ($files.Count -gt 1) {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "Multiple .vsix files produced under: $searchRoot. Narrow by name if needed."
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE "${{ env.VSIX_STAGING_DIR }}\$($files[0].Name)"
          Copy-Item $files[0].FullName -Destination $dest -Force
          Write-Host "Staged signed VSIX: $dest"

      - name: Upload signed VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: ${{ env.VSIX_STAGING_DIR }}/*.vsix

  publish_openvsix_and_tag:
    name: Publish Nightly (Open VSIX) + Tag
    needs: [validate, package_signed]
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      NIGHTLY_TAG: nightly/vsix/${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout (for tagging)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: _staging

      - name: Locate VSIX (from artifact)
        id: locate_vsix
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\_staging" -Recurse -Filter *.vsix
          if ($files.Count -eq 0) { throw "No .vsix found in downloaded artifact." }
          if ($files.Count -gt 1) {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "Multiple .vsix files found in artifact. Narrow the search."
          }
          "vsix=$($files[0].FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Using VSIX: $($files[0].FullName)"

      - name: Publish to Open VSIX Gallery (nightly)
        uses: timheuer/openvsixpublish@04b38d641d8b7475ab6ddece48e42525d58b0875 # v1
        with:
          vsix-file: ${{ steps.locate_vsix.outputs.vsix }}

      - name: Guard - version output must not be empty
        shell: pwsh
        run: |
          $v = "${{ needs.validate.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Version output is empty; refusing to tag nightly/." }

      - name: Guard - nightly tag must not already exist
        shell: pwsh
        run: |
          $tag = "${{ env.NIGHTLY_TAG }}"
          git fetch --tags --force
          if (git tag -l $tag) { throw "Nightly tag '$tag' already exists. Refusing to overwrite." }

      - name: Create and push nightly tag
        shell: pwsh
        run: |
          $tag = "${{ env.NIGHTLY_TAG }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      - name: Write summary
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $tag = "${{ env.NIGHTLY_TAG }}"
          "### VSIX nightly published" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Version: **$version**" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "- Tag: **$tag**" | Out-File -Append $env:GITHUB_STEP_SUMMARY
